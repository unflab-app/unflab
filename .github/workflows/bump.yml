name: Propose upstream bumps

# Turns the nightly version report into something administrators can act on.
#
# For each outdated recipe: rewrite it to the new version, re-pin the
# SHA-256, check it against whatever the upstream publishes, and open a
# pull request. build.yml already runs on pull_request, so the PR gets
# the full matrix -- build, otool gate, litmus test, attestation in
# strict mode -- with no extra wiring. A green PR is a bump that has
# been proven to build; a red one is a bump that shouldn't be merged.
#
# This won't actually ship it though, as branches are namespaced bump/*
# and not tagged v*
on:
  schedule:
    # Shortly after check-updates, so the report exists first. Both
    # resolve upstream versions, so the gap only needs to be long
    # enough that they aren't running concurrently.
    - cron: "34 7 * * *"
  workflow_dispatch:
    inputs:
      recipe:
        description: "Single recipe to bump (blank = all outdated)"
        required: false
      version:
        description: "Target version (requires recipe; blank = latest)"
        required: false

# Everything that writes uses the App token below, not GITHUB_TOKEN: a
# pull request opened by GITHUB_TOKEN gets its pull_request runs held at
# "requires approval from a maintainer", one click per bump.
permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@v7
        with:
          # A shallow clone can't branch off main cleanly.
          fetch-depth: 0
          # So the pushes below are the App's too.
          token: ${{ steps.app.outputs.token }}

      - name: Work out what to bump
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.recipe }}" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              echo "${{ inputs.recipe }} ${{ inputs.version }}" > plan.txt
            else
              # Resolve just this one through the same checker, so a
              # manual run and a nightly run agree about what "latest"
              # means.
              scripts/check-updates.sh "${{ inputs.recipe }}" \
                | awk '/UPDATE$/ { print $1, $3 }' > plan.txt
            fi
          else
            # check-updates.sh exits 1 if any check failed. That is
            # check-updates.yml's to report; it shouldn't hold back the
            # updates the other checks did find.
            { scripts/check-updates.sh || true; } |
              awk '/UPDATE$/ { print $1, $3 }' > plan.txt
          fi

          echo "count=$(wc -l < plan.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Planned bumps:"; cat plan.txt

      - name: Open or update one pull request per recipe
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail

          # Created here rather than assumed: gh pr create fails
          # outright on a label that doesn't exist.
          gh label create upstream-bump --repo "$GITHUB_REPOSITORY" \
            --color 1D76DB --description "Automated version bump" \
            2>/dev/null || true

          bot_name="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/$bot_name" --jq .id)
          bot_email="$bot_id+$bot_name@users.noreply.github.com"
          git config user.name "$bot_name"
          git config user.email "$bot_email"

          opened=0
          updated=0
          skipped=0
          failed=0

          while read -r recipe version; do
            [ -n "$recipe" ] || continue

            # One branch per recipe, not per version: a newer upstream
            # release replaces the open proposal instead of stacking a
            # second PR beside it.
            branch="bump/$recipe"
            title="$recipe $version"

            pr=$(gh pr list --head "$branch" --state open --limit 1 \
                   --json number,title --jq '.[] | "\(.number)\t\(.title)"')
            pr_num=${pr%%$'\t'*}
            pr_title=${pr#*$'\t'}

            if [ -n "$pr" ] && [ "$pr_title" = "$title" ]; then
              echo "== $title: already proposed (#$pr_num)"
              skipped=$((skipped + 1))
              continue
            fi

            # A PR closed unmerged is a declined bump. Its title is the
            # record, now that the branch name no longer carries the
            # version.
            declined=$(TITLE="$title" gh pr list --head "$branch" --state all \
                         --limit 100 --json title,state \
                         --jq '[.[] | select(.state == "CLOSED" and .title == env.TITLE)] | length' \
                       || echo 0)
            if [ "$declined" != 0 ]; then
              echo "== $title: declined before; not reproposing"
              skipped=$((skipped + 1))
              continue
            fi

            # Someone fixing up comments or the README on the open PR is
            # the expected workflow. Force-pushing a newer version over
            # that would silently throw their work away.
            if [ -n "$pr" ]; then
              others=$(git log --format=%ae "origin/main..origin/$branch" \
                         | grep -vxF "$bot_email" || true)
              if [ -n "$others" ]; then
                echo "== $title: #$pr_num ($pr_title) has human commits; leaving it alone"
                skipped=$((skipped + 1))
                continue
              fi
            fi

            echo "== $recipe -> $version"
            git checkout -q -B "$branch" origin/main

            # bump.sh refuses if the upstream's own evidence contradicts
            # the download, so a failure here is a reason not to open
            # the PR at all rather than something to review.
            if ! scripts/bump.sh "$recipe" "$version" >bump.log 2>&1; then
              echo "   bump failed:"; sed 's/^/   /' bump.log
              failed=$((failed + 1))
              continue
            fi

            attested=$(grep -c 'attest: sha256 matches\|attest: OpenPGP signature verified' bump.log || true)
            if [ "$attested" -gt 0 ]; then
              evidence="Verified against the checksum or signature the upstream publishes."
            else
              evidence="This upstream publishes nothing to verify against; see UNFLAB_ATTEST in the recipe. The pin below is what was downloaded, nothing more."
            fi

            git add "utils/$recipe"
            msg="$(printf '%s\n\n%s\n\n%s\n' \
              "$recipe: $version" \
              "Automated version bump. The recipe's declarations are rewritten; comments mentioning the old version are deliberately left alone for a human to update." \
              "$evidence")"
            git commit -q -m "$msg"

            # The lease is against what was fetched at checkout, so a
            # human push since then makes this fail rather than vanish.
            if ! git push -q --force-with-lease origin "$branch"; then
              echo "   push refused"; failed=$((failed + 1)); continue
            fi

            body="$(printf '%s\n\n%s\n\n%s\n' \
              "Bumps \`$recipe\` to $version." \
              "$evidence" \
              "CI on this PR builds it, runs the otool gate and the litmus test, and checks attestation in strict mode. Merge only if it is green. Comments in the recipe that mention the old version are not updated automatically -- worth a look before merging.")"

            if [ -n "$pr" ]; then
              gh pr edit "$pr_num" --title "$title" --body "$body" \
                || { echo "   PR update failed"; failed=$((failed + 1)); continue; }
              echo "   #$pr_num: $pr_title -> $title"
              updated=$((updated + 1))
            else
              gh pr create --title "$title" --head "$branch" --base main \
                --label upstream-bump --body "$body" \
                || { echo "   PR creation failed"; failed=$((failed + 1)); continue; }
              opened=$((opened + 1))
            fi
          done < plan.txt

          echo
          echo "$opened opened, $updated updated, $skipped skipped, $failed failed."
          [ "$failed" -eq 0 ]
